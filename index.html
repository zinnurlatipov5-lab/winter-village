<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Зимняя деревня: 41 день до чуда</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a2440; }
    </style>
</head>
<body>
    <div id="scene-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    // ===== ЗИМНЯЯ ДЕРЕВНЯ: сцена =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a2440); // тёмное зимнее небо
    scene.fog = new THREE.Fog(0x1a2440, 20, 70);  // туман Тишины

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('scene-container').appendChild(renderer.domElement);

    // Свет: холодная луна
    scene.add(new THREE.AmbientLight(0x8090b0, 0.7));
    const moon = new THREE.DirectionalLight(0xcdd6ff, 0.9);
    moon.position.set(-10, 20, 5);
    scene.add(moon);

    // Снежный пол
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0xe8eef7 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Домики деревни
    function makeHouse(x, z) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(6, 5, 6),
        new THREE.MeshStandardMaterial({ color: 0x5d4037 })
      );
      body.position.y = 2.5;
      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(5, 3, 4),
        new THREE.MeshStandardMaterial({ color: 0x3e2723 })
      );
      roof.position.y = 6.5;
      roof.rotation.y = Math.PI / 4;
      const window = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 1.2, 0.2),
        new THREE.MeshStandardMaterial({ color: 0xffd86b, emissive: 0xffb300 })
      );
      window.position.set(0, 2.5, 3.05);
      g.add(body, roof, window);
      g.position.set(x, 0, z);
      scene.add(g);
    }
    makeHouse(-20, -25);
    makeHouse(25, -20);

    // Мельница на холме (запад, по лору)
    const mill = new THREE.Mesh(
      new THREE.CylinderGeometry(3, 4, 14, 8),
      new THREE.MeshStandardMaterial({ color: 0x4a3b2e })
    );
    mill.position.set(-40, 7, -60);
    scene.add(mill);

    // Ёлка на площади — голый ствол без звезды
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.8, 12, 8),
      new THREE.MeshStandardMaterial({ color: 0x3e2723 })
    );
    trunk.position.set(0, 6, -35);
    scene.add(trunk);

    // Падающий снег
    const snowflakes = [];
    for (let i = 0; i < 300; i++) {
      const f = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 4, 4),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      f.position.set(
        (Math.random() - 0.5) * 120,
        Math.random() * 40,
        (Math.random() - 0.5) * 120
      );
      snowflakes.push(f);
      scene.add(f);
    }

    // Камера смотрит на площадь с ёлкой
    camera.position.set(0, 5, 0);
    camera.lookAt(0, 8, -35);

    function animate() {
      requestAnimationFrame(animate);
      snowflakes.forEach(f => {
        f.position.y -= 0.12;
        if (f.position.y < 0) f.position.y = 40;
      });
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    </script>
</body>
</html>
