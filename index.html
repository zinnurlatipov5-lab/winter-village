<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Метельск: Горизонтальная версия</title>
  <style>
    body { margin: 0; overflow: hidden; background: #05080a; font-family: 'Courier New', monospace; }
    
    /* Горизонтальная ориентация */
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #0a1520 0%, #000000 100%);
    }

    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

    /* Интерфейс */
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
    
    #status-bar {
      background: rgba(0, 0, 0, 0.6); color: #fff; padding: 10px; border-radius: 8px;
      font-size: 14px; text-align: center; border-left: 4px solid #ff4d4d;
      pointer-events: auto;
    }

    #controls { display: flex; gap: 15px; align-items: flex-end; }
    
    /* Джойстик */
    #joy-base {
      width: 140px; height: 140px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }
    #joy-knob {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.3); border: 2px solid #fff;
      position: absolute; top: 40px; left: 40px;
      transition: transform 0.1s;
    }

    /* Кнопка действия */
    #action-btn {
      width: 100px; height: 100px; border-radius: 50%;
      background: linear-gradient(145deg, #ff5e5e, #cc0000);
      color: white; font-weight: bold; font-size: 18px;
      border: none; cursor: pointer; box-shadow: 0 0 20px rgba(255, 94, 94, 0.5);
      pointer-events: auto;
    }

    /* Всплывающее окно */
    #modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #1a1a1a; color: #ccc; padding: 30px;
      border: 1px solid #444; width: 350px; max-width: 90%;
      display: none; text-align: center; pointer-events: auto;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    #modal h2 { color: #ff4d4d; margin-top: 0; }
    #close-btn { background: #333; color: white; border: none; padding: 8px 16px; cursor: pointer; margin-top: 15px; }

    /* Подсказка взаимодействия */
    #hint-text {
      position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px;
      border-radius: 20px; font-size: 14px; display: none;
      text-shadow: 0 1px 2px black;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="ui-layer">
    <div id="status-bar">Деревня Метельск | Состояние: Спокойно</div>
    <div id="hint-text">Нажмите [Действие], чтобы осмотреть объект</div>
    <div id="controls">
      <div id="joy-base"><div id="joy-knob"></div></div>
      <button id="action-btn">ДЕЙСТВИЕ</button>
    </div>
  </div>

  <div id="modal">
    <h2 id="modal-title">Тайна</h2>
    <p id="modal-content">Здесь что-то скрыто...</p>
    <button id="close-btn">Закрыть</button>
  </div>
</div>

<!-- Подключаем Three.js и PostProcessing -->
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { FilmPass } from 'three/addons/postprocessing/FilmPass.js';

  // === КОНФИГУРАЦИЯ ===
  const CONFIG = {
    bloomStrength: 1.5,
    bloomRadius: 0.4,
    bloomThreshold: 0.1,
    fogColor: 0x0a1520,
    fogNear: 10,
    fogFar: 120
  };

  // === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
  let scene, camera, renderer, composer;
  let moveVec = new THREE.Vector2(0, 0);
  let lookVec = new THREE.Vector2(0, 0);
  let playerPos = new THREE.Vector3(0, 1.6, 40);
  let playerDir = new THREE.Vector3();
  let objects = ; // Для коллизий
  let interactable = null;
  
  // Элементы UI
  const joyBase = document.getElementById('joy-base');
  const joyKnob = document.getElementById('joy-knob');
  const actionBtn = document.getElementById('action-btn');
  const hintText = document.getElementById('hint-text');
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modal-title');
  const modalContent = document.getElementById('modal-content');
  const closeBtn = document.getElementById('close-btn');
  const statusBar = document.getElementById('status-bar');

  init();
  animate();

  function init() {
    // 1. СЦЕНА И КАМЕРА
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05080a);
    scene.fog = new THREE.FogExp2(CONFIG.fogColor, 0.015);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
    
    // 2. ОСВЕЩЕНИЕ
    const ambient = new THREE.AmbientLight(0x404040, 0.4);
    scene.add(ambient);

    // Лунный свет (холодный)
    const moonLight = new THREE.DirectionalLight(0xcdd8ee, 0.8);
    moonLight.position.set(-50, 60, 30);
    scene.add(moonLight);

    // Источники света (фонари, окна) будут добавлены в функциях создания объектов

    // 3. ГЕОМЕТРИЯ И МАТЕРИАЛЫ (ПРОЦЕДУРНЫЕ)
    const woodMat = createWoodMaterial();
    const stoneMat = createStoneMaterial();
    const snowMat = createSnowMaterial();
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.9 });
    const windowMat = new THREE.MeshStandardMaterial({ color: 0xffe0b2, emissive: 0xffa000, emissiveIntensity: 1.2 });
    const redWindowMat = new THREE.MeshStandardMaterial({ color: 0x220000, emissive: 0xff0000, emissiveIntensity: 2.0 });

    // 4. МИР
    createGround();
    createRoad();
    createHouses(woodMat, stoneMat, windowMat, redWindowMat);
    createWell(woodMat, stoneMat);
    createTrees(woodMat);
    createFences(woodMat);
    createLamps(woodMat);
    createDrifts(snowMat);

    // 5. РЕНДЕРЕР И POST-PROCESSING (Для "киношного" вида)
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    // Настройка эффектов (Bloom + Film Grain)
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    const filmPass = new FilmPass(0.8, 0.35, 2048, false);

    composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);
    composer.addPass(filmPass);

    // 6. УПРАВЛЕНИЕ
    setupControls();
    window.addEventListener('resize', onWindowResize, false);
  }

  // --- ГЕНЕРАЦИЯ МАТЕРИАЛОВ ---
  function createWoodMaterial() {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#5a4a3a'; ctx.fillRect(0,0,256,256);
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    for(let i=0; i<500; i++) ctx.fillRect(Math.random()*256, Math.random()*256, 10, 10);
    ctx.globalCompositeOperation = 'lighten';
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    for(let i=0; i<200; i++) ctx.fillRect(Math.random()*256, Math.random()*256, 20, 20);
    
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(4, 4);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7, metalness: 0.1 });
  }

  function createStoneMaterial() {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#4a505a'; ctx.fillRect(0,0,256,256);
    ctx.fillStyle = '#3a404a';
    for(let i=0; i<30; i++) {
      const w = 20 + Math.random()*40;
      const h = 15 + Math.random()*30;
      ctx.fillRect(Math.random()*(256-w), Math.random()*(256-h), w, h);
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(2, 2);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9, color: 0x555555 });
  }

  function createSnowMaterial() {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#eef2f7'; ctx.fillRect(0,0,256,256);
    ctx.fillStyle = '#dfe0e5';
    for(let i=0; i<1000; i++) {
      ctx.beginPath();
      ctx.arc(Math.random()*256, Math.random()*256, Math.random()*2, 0, Math.PI*2);
      ctx.fill();
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(10, 10);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9, color: 0xffffff });
  }

  // --- СОЗДАНИЕ МИРА ---
  function createGround() {
    const geo = new THREE.PlaneGeometry(1000, 1000);
    const mat = createSnowMaterial();
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.receiveShadow = true;
    scene.add(mesh);
  }

  function createRoad() {
    const geo = new THREE.PlaneGeometry(12, 200);
    const mat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(0, 0.01, 0);
    mesh.receiveShadow = true;
    scene.add(mesh);
    objects.push({ type: 'box', pos: new THREE.Vector3(0,0,0), size: new THREE.Vector3(12, 1, 200) });
  }

  function createHouses(wood, stone, win, redWin) {
    const spots = [
      { x: -25, z: -40, rot: 0, red: true },
      { x: 25, z: -40, rot: 0, red: false },
      { x: -15, z: -10, rot: Math.PI/2, red: false },
      { x: 15, z: -10, rot: -Math.PI/2, red: false },
      { x: 0, z: -60, rot: 0, red: false }
    ];

    spots.forEach(spot => {
      const house = new THREE.Group();
      
      // Фундамент
      const base = new THREE.Mesh(new THREE.BoxGeometry(8, 1, 8), stone);
      base.position.y = 0.5;
      house.add(base);

      // Стены
      const walls = new THREE.Mesh(new THREE.BoxGeometry(7, 5, 7), wood);
      walls.position.y = 3;
      house.add(walls);

      // Крыша
      const roofGeo = new THREE.ConeGeometry(5, 3.5, 4);
      const roof = new THREE.Mesh(roofGeo, new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 }));
      roof.position.y = 6.5;
      roof.rotation.y = Math.PI/4;
      house.add(roof);

      // Снег на крыше
      const snowCap = new THREE.Mesh(new THREE.ConeGeometry(4.8, 1.2, 4), createSnowMaterial());
      snowCap.position.y = 7.2;
      snowCap.rotation.y = Math.PI/4;
      house.add(snowCap);

      // Окна
      const winGeo = new THREE.BoxGeometry(1.5, 1.5, 0.2);
      const wMat = spot.red ? redWin : win;
      
      const w1 = new THREE.Mesh(winGeo, wMat);
      w1.position.set(-2.5, 3, 3.5);
      house.add(w1);

      const w2 = new THREE.Mesh(winGeo, wMat);
      w2.position.set(2.5, 3, 3.5);
      house.add(w2);

      // Дымоход
      const chimney = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), stone);
      chimney.position.set(2, 7.5, 2);
      house.add(chimney);

      house.position.set(spot.x, 0, spot.z);
      house.rotation.y = spot.rot;
      scene.add(house);

      // Коллизия
      objects.push({ type: 'box', pos: new THREE.Vector3(spot.x, 0, spot.z), size: new THREE.Vector3(4, 3, 4), interact: spot.red ? 'red_house' : 'house' });
    });
  }

  function createWell(wood, stone) {
    const well = new THREE.Group();
    
    // Сруб
    const logGeo = new THREE.BoxGeometry(0.4, 1.2, 1.0);
    for(let i=0; i<12; i++) {
      const a = i * Math.PI*2/12;
      const log = new THREE.Mesh(logGeo, wood);
      log.position.set(Math.cos(a)*1.4, 0.6, Math.sin(a)*1.4);
      log.rotation.y = -a;
      well.add(log);
    }

    // Навес
    const postGeo = new THREE.BoxGeometry(0.3, 3, 0.3);
    const p1 = new THREE.Mesh(postGeo, wood); p1.position.set(-1.8, 1.5, 0); well.add(p1);
    const p2 = new THREE.Mesh(postGeo, wood); p2.position.set(1.8, 1.5, 0); well.add(p2);
    
    const beamGeo = new THREE.BoxGeometry(4, 0.2, 0.2);
    const b = new THREE.Mesh(beamGeo, wood); b.position.set(0, 3, 0); well.add(b);

    // Ведро (декорация)
    const bucket = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.6, 8), stone);
    bucket.position.set(0, 2.5, 0);
    well.add(bucket);

    well.position.set(10, 0, -20);
    scene.add(well);
    objects.push({ type: 'cylinder', pos: new THREE.Vector3(10, 0, -20), radius: 1.5, height: 3, interact: 'well' });
  }

  function createTrees(wood) {
    const spots = [[-30, -20], [30, -20], [-10, 10], [10, 10], [-40, -50], [40, -50]];
    spots.forEach(p => {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2, 6), wood);
      trunk.position.y = 1;
      tree.add(trunk);
      
      const cone = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 8), new THREE.MeshStandardMaterial({ color: 0x1a2a15, roughness: 0.8 }));
      cone.position.y = 2.5;
      tree.add(cone);

      tree.position.set(p, 0, p);
      scene.add(tree);
      objects.push({ type: 'cylinder', pos: new THREE.Vector3(p, 0, p), radius: 1, height: 4 });
    });
  }

  function createFences(wood) {
    const fenceGeo = new THREE.BoxGeometry(0.1, 1.5, 0.1);
    const fenceMat = wood;
    
    // Линия забора
    const count = 50;
    for(let i=0; i<count; i++) {
      const t = i / count;
      const x = -20 + t * 40;
      const z = -50;
      const post = new THREE.Mesh(fenceGeo, fenceMat);
      post.position.set(x, 0.75, z);
      scene.add(post);
      objects.push({ type: 'box', pos: new THREE.Vector3(x, 0, z), size: new THREE.Vector3(0.2, 1.5, 0.2) });
    }
  }

  function createLamps(wood) {
    const spots = [[0, -30], [-15, -10], [15, -10]];
    spots.forEach(p => {
      const lamp = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 3, 6), wood);
      pole.position.y = 1.5;
      lamp.add(pole);
      
      const lightSource = new THREE.PointLight(0xffaa00, 2, 15);
      lightSource.position.set(0, 3.5, 0);
      lamp.add(lightSource);

      lamp.position.set(p, 0, p);
      scene.add(lamp);
    });
  }

  function createDrifts(snow) {
    for(let i=0; i<20; i++) {
      const drift = new THREE.Mesh(new THREE.SphereGeometry(1 + Math.random()*1.5, 8, 6), snow);
      drift.scale.y = 0.5 + Math.random()*0.3;
      drift.position.set((Math.random()-0.5)*80, 0.5, (Math.random()-0.5)*80);
      scene.add(drift);
    }
  }

  // --- УПРАВЛЕНИЕ ---
  function setupControls() {
    // Джойстик
    const startTouch = (e) => {
      if(e.touches.length > 1) return;
      const t = e.touches;
      const rect = joyBase.getBoundingClientRect();
      const centerX = rect.left + rect.width/2;
      const centerY = rect.top + rect.height/2;
      
      const dx = t.clientX - centerX;
      const dy = t.clientY - centerY;
      const dist = Math.hypot(dx, dy);
      const max = 60;
      
      if(dist > max) {
        const ratio = max / dist;
        moveVec.set(dx * ratio, dy * ratio);
      } else {
        moveVec.set(dx, dy);
      }
      
      // Визуализация
      const normX = (moveVec.x / 60) * 40;
      const normY = (moveVec.y / 60) * 40;
      joyKnob.style.transform = `translate(${normX}px, ${normY}px)`;
    };

    joyBase.addEventListener('touchstart', startTouch, {passive: false});
    joyBase.addEventListener('touchmove', startTouch, {passive: false});
    joyBase.addEventListener('touchend', () => { moveVec.set(0,0); joyKnob.style.transform = 'translate(0,0)'; }, {passive: false});

    // Вращение камеры (свайп по экрану)
    let lastX = 0, lastY = 0;
    let isDragging = false;

    document.addEventListener('touchstart', (e) => {
      if(e.target.closest('#joy-base') || e.target.closest('#action-btn')) return;
      isDragging = true;
      lastX = e.touches.clientX;
      lastY = e.touches.clientY;
    }, {passive: false});

    document.addEventListener('touchmove', (e) => {
      if(!isDragging) return;
      const x = e.touches.clientX;
      const y = e.touches.clientY;
      
      const dx = (x - lastX) * 0.002;
      const dy = (y - lastY) * 0.002;
      
      lookVec.x += dx;
      lookVec.y += dy;
      lookVec.y = Math.max(-1.2, Math.min(1.2, lookVec.y)); // Ограничение взгляда вверх/вниз
      
      lastX = x;
      lastY = y;
    }, {passive: false});

    document.addEventListener('touchend', () => isDragging = false);

    // Кнопка действия
    actionBtn.addEventListener('click', () => {
      if(interactable) {
        showModal(interactable.type);
      }
    });

    // Закрытие модалки
    closeBtn.addEventListener('click', () => modal.style.display = 'none');
  }

  function showModal(type) {
    modal.style.display = 'block';
    if(type === 'red_house') {
      modalTitle.innerText = "Странный дом";
      modalContent.innerText = "В окне горит красный свет. Слышен тихий скрежет, будто кто-то царапает стекло изнутри.";
      statusBar.innerText = "Деревня Метельск | Состояние: Тревога";
      statusBar.style.borderLeftColor = "#ff4d4d";
    } else if (type === 'well') {
      modalTitle.innerText = "Колодец";
      modalContent.innerText = "Вода внизу кажется черной. На срубе вырезаны странные символы.";
      statusBar.innerText = "Деревня Метельск | Состояние: Подозрительно";
      statusBar.style.borderLeftColor = "#ffff00";
    } else {
      modalTitle.innerText = "Обычный дом";
      modalContent.innerText = "Пусто. Все вещи давно вынесены.";
    }
  }

  // --- ИГРОВОЙ ЦИКЛ ---
  function animate() {
    requestAnimationFrame(animate);

    // 1. Движение
    if (moveVec.length() > 0.1) {
      const speed = 0.15;
      // Нормализуем вектор движения относительно камеры
      const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0,1,0), lookVec.x);
      const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0,1,0), lookVec.x);
      
      const moveDir = forward.multiplyScalar(-moveVec.y).add(right.multiplyScalar(moveVec.x));
      moveDir.normalize();
      
      const nextPos = new THREE.Vector3(playerPos.x + moveDir.x * speed, playerPos.y, playerPos.z + moveDir.z * speed);
      
      if (!checkCollision(nextPos)) {
        playerPos.add(moveDir.multiplyScalar(speed));
      }
    }

    // 2. Камера
    // Камера следует за игроком, но с небольшим отставанием для плавности
    camera.position.lerp(new THREE.Vector3(playerPos.x, playerPos.y + 1.6, playerPos.z + 5), 0.1);
    
    // Поворот камеры
    camera.rotation.y = lookVec.x;
    camera.rotation.x = -lookVec.y;

    // 3. Проверка взаимодействия
    interactable = null;
    let minDist = 100;
    
    objects.forEach(obj => {
      const dist = playerPos.distanceTo(obj.pos);
      if(dist < 4 && obj.interact) {
        if(dist < minDist) {
          minDist = dist;
          interactable = obj;
        }
      }
    });

    if(interactable) {
      hintText.style.display = 'block';
    } else {
      hintText.style.display = 'none';
    }

    // Рендер
    composer.render();
  }

  function checkCollision(newPos) {
    for (const obj of objects) {
      if (obj.type === 'box') {
        const halfSize = obj.size.clone().multiplyScalar(0.5);
        if (newPos.x >= obj.pos.x - halfSize.x && newPos.x <= obj.pos.x + halfSize.x &&
            newPos.z >= obj.pos.z - halfSize.z && newPos.z <= obj.pos.z + halfSize.z) {
          return true;
        }
      } else if (obj.type === 'cylinder') {
        const dx = newPos.x - obj.pos.x;
        const dz = newPos.z - obj.pos.z;
        if (Math.hypot(dx, dz) < obj.radius) {
          return true;
        }
      }
    }
    return false;
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  }
</script>
