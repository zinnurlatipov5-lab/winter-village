<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Зимняя деревня: Метельск</title>
  <style>
    body { margin:0; overflow:hidden; background:#2b3a4d; touch-action:none; font-family:Arial,sans-serif; }
    #quest-hint {
      position:fixed; top:10px; left:50%; transform:translateX(-50%);
      color:#dfe8f2; background:rgba(20,30,45,.75); padding:8px 14px; border-radius:8px;
      font-size:14px; z-index:20; pointer-events:none; max-width:90%; text-align:center;
    }
    #panel {
      position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
      background:#f4ecd8; color:#2b2114; padding:18px; border-radius:10px;
      max-width:300px; max-height:70vh; overflow-y:auto; font-size:14px; line-height:1.5;
      display:none; z-index:30; box-shadow:0 6px 20px rgba(0,0,0,.5); white-space:pre-line;
    }
    #panel-close {
      margin-top:12px; padding:8px 18px; background:#7a5c3e; color:#fff;
      border:none; border-radius:6px; width:100%; font-size:14px; cursor:pointer;
    }
    #joy {
      position:fixed; bottom:30px; left:25px; width:130px; height:130px; border-radius:65px;
      background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); z-index:20;
    }
    #knob {
      position:absolute; left:40px; top:40px; width:50px; height:50px; border-radius:25px;
      background:rgba(255,255,255,.35); border:2px solid #fff;
    }
  </style>
</head>
<body>
  <div id="quest-hint">Пройди по дороге к центру деревни. Найди письмо на пороге дома.</div>
  <div id="panel"><button id="panel-close">Закрыть</button></div>
  <div id="joy"><div id="knob"></div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ===== СЦЕНА, СВЕТ, КАМЕРА =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b3a4d);
    scene.fog = new THREE.Fog(0x2b3a4d, 12, 55);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 300);
    camera.position.set(15, 10, 25);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x8a99b0, 0.75));
    const moon = new THREE.DirectionalLight(0xcdd6ff, 0.65);
    moon.position.set(-10, 25, 5);
    scene.add(moon);

    // ===== ТЕКСТУРЫ =====
    const loader = new THREE.TextureLoader();
    // Если нет картинок — замени map на color в материалах ниже
    const snowTexture = loader.load('snow.png');
    snowTexture.wrapS = snowTexture.wrapT = THREE.RepeatWrapping;

    const snowdriftTexture = loader.load('snowdrift.png');
    snowdriftTexture.wrapS = snowdriftTexture.wrapT = THREE.RepeatWrapping;

    const woodTexture = loader.load('wood.png');
    woodTexture.wrapS = woodTexture.wrapT = THREE.RepeatWrapping;

    const windowTexture = loader.load('window.png');
    const brickTexture = loader.load('brick.png');
    const roofTexture = loader.load('roof.png');

    const matSnow = new THREE.MeshStandardMaterial({ color: 0xdde6ee, roughness: 1, map: snowTexture });
    const matDrift = new THREE.MeshStandardMaterial({ color: 0xe8eff6, roughness: 1, map: snowdriftTexture });
    const matRoad = new THREE.MeshStandardMaterial({ color: 0xbfc9d4, roughness: 1 });
    const matWood = new THREE.MeshStandardMaterial({ color: 0x3a3129, roughness: 1, map: woodTexture });
    const matDark = new THREE.MeshStandardMaterial({ color: 0x151a20, roughness: 1 });
    const matBrick = new THREE.MeshStandardMaterial({ color: 0x5a5a5a, roughness: 1, map: brickTexture });
    const matRoof = new THREE.MeshStandardMaterial({ color: 0x2c2c34, roughness: 1, map: roofTexture });

    // ===== ЗЕМЛЯ И ДОРОГА =====
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), matSnow);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    function roadSegment(x1, z1, x2, z2, w) {
      const dx = x2 - x1, dz = z2 - z1, len = Math.hypot(dx, dz);
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, len), matRoad);
      m.rotation.x = -Math.PI / 2;
      m.rotation.z = Math.atan2(dx, dz);
      m.position.set((x1 + x2) / 2, 0.02, (z1 + z2) / 2);
      scene.add(m);
    }

    roadSegment(0, 60, 2, 20, 4);
    roadSegment(2, 20, 0, -5, 4);
    roadSegment(0, -5, -2, -18, 4);
    roadSegment(-2, -18, -12, -20, 3);
    roadSegment(0, -5, 14, -8, 3);
    roadSegment(-2, -18, -30, -40, 3);
    roadSegment(2, -18, 30, -38, 3);
    roadSegment(0, -18, 0, -42, 3);

    // Сугробы
    function drift(x, z, s) {
      const d = new THREE.Mesh(new THREE.SphereGeometry(s, 6, 4), matDrift);
      d.scale.y = 0.35;
      d.position.set(x, 0.1, z);
      scene.add(d);
    }
    const driftSpots = [[-4,50],[5,42],[-6,30],[6,10],[-5,-2],[7,-12],[-6,-24],[9,-16],[-8,-34],[12,-30],[-16,-28],[20,-34]];
    driftSpots.forEach(p => drift(p[0], p[1], 1 + Math.random()*1.5));

    // ===== ДОМА =====
    function makeHouse(x, z, color, rot) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(6,5,6), matBrick);
      body.position.y = 2.5;

      const winMat = new THREE.MeshStandardMaterial({ color:0x0d1116, roughness:.6, map: windowTexture });
      const w1 = new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,.2), winMat);
      w1.position.set(-1.5, 2.5, 3.05);
      const w2 = new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,.2), winMat);
      w2.position.set(1.5, 2.5, 3.05);
      const w3 = new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,.2), winMat);
      w3.position.set(0, 2.5, 3.05);

      const roof = new THREE.Mesh(new THREE.ConeGeometry(5,3,4), matRoof);
      roof.position.y = 6.5;
      roof.rotation.y = Math.PI/4;

      const cap = new THREE.Mesh(new THREE.ConeGeometry(4.7,1.6,4), new THREE.MeshStandardMaterial({ color:0xf2f6fa, roughness:1 }));
      cap.position.y = 7.2;
      cap.rotation.y = Math.PI/4;

      const pipe = new THREE.Mesh(new THREE.BoxGeometry(.8,2,.8), matDark);
      pipe.position.set(1.6, 6.4, 0);

      const porch = new THREE.Mesh(new THREE.BoxGeometry(2.2,0.4,1.2), matWood);
      porch.position.set(0, 0.2, 3.4);

      g.add(body, w1, w2, w3, roof, cap, pipe, porch);
      g.position.set(x,0,z);
      g.rotation.y = rot || 0;
      scene.add(g);
      return g;
    }

    const houseColors = [0x4d5a63,0x5d5348,0x465a4f,0x5a4d5a,0x4d4a5a,0x5a5d4d,0x50463d,0x3d4d55,0x554d5d];
    const houseSpots = [[-20,-10],[20,-10],[-30,-30],[30,-30],[-15,-45],[15,-45],[0,-55],[-35,-15],[35,-15]];
    houseSpots.forEach((p,i) => makeHouse(p[0], p[1], houseColors[i]));
    makeHouse(-12, -22, 0x6b7a85, 0); // почта

    // ===== МЕЛЬНИЦА =====
    const mill = new THREE.Group();
    const millBody = new THREE.Mesh(new THREE.BoxGeometry(8, 8, 8), matWood);
    millBody.position.set(0, 10, 0);

    const millBlades = new THREE.Group();
    for (let i = 0; i < 3; i++) {
      const blade = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 5), matDark);
      blade.position.set(0, 0, 0);
      blade.rotation.set(0, i * (Math.PI / 3), 0);
      millBlades.add(blade);
    }
    mill.add(millBody, millBlades);
    mill.position.set(-20, 15, -20);
    scene.add(mill);

    // ===== ОЗЕРО =====
    const lake = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x99ccff, roughness: 1 }));
    lake.rotation.x = -Math.PI/2;
    lake.position.set(0, -45, 0);
    scene.add(lake);

    // ===== СТОЛБЫ И ФОНАРИ =====
    function pole(x, z) {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 10), matDark);
      p.position.set(x, 0, z);
      scene.add(p);
    }
    [[-25, -25], [25, -25], [-25, 25], [25, 25]].forEach(p => pole(p[0], p[1]));

    function lamp(x, z) {
      const l = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 0.5), matDark);
      l.position.set(x, 1, z);
      scene.add(l);
    }
    [[-20, -20], [20, -20], [-20, 20], [20, 20]].forEach(p => lamp(p[0], p[1]));

    // ===== АНИМАЦИЯ И РЕНДЕР =====
    const clock = new THREE.Clock();
    let time = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      time += delta;

      // Вращение лопастей мельницы
      millBlades.rotation.z = time * 0.1;

      renderer.render(scene, camera);
    }

    animate();

    // Закрытие панели
    document.getElementById('panel-close').addEventListener('click', () => {
      document.getElementById('panel').style.display = 'none';
    });
  </script>
</body>
</html>
