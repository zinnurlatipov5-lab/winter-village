<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Метельск</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#05080d; font-family:Arial,sans-serif; touch-action:none; }
  canvas { display:block; }
  #rotate {
    position:fixed; inset:0; background:#05080d; color:#dfe8f2; z-index:100;
    display:none; align-items:center; justify-content:center; text-align:center; font-size:18px; padding:20px;
  }
  #hint {
    position:fixed; top:12px; left:50%; transform:translateX(-50%);
    color:#e6edf5; background:rgba(8,12,20,.85); padding:9px 16px; border-radius:8px;
    font-size:14px; z-index:20; pointer-events:none; max-width:92%; text-align:center;
    border-left:3px solid #6fa8dc; white-space:pre-line;
  }
  #joy {
    position:fixed; bottom:24px; left:24px; width:140px; height:140px; border-radius:70px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.25); z-index:20;
  }
  #knob {
    position:absolute; left:45px; top:45px; width:50px; height:50px; border-radius:25px;
    background:rgba(255,255,255,.35); border:2px solid #fff;
  }
  #act {
    position:fixed; bottom:40px; right:30px; width:96px; height:96px; border-radius:48px;
    background:rgba(180,40,40,.35); border:2px solid rgba(255,120,120,.6); z-index:20;
    color:#fff; font-size:15px; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
  }
  #panel {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    background:#f4ecd8; color:#2b2114; padding:22px; border-radius:10px;
    width:78%; max-width:480px; font-size:15px; line-height:1.55;
    display:none; z-index:40; box-shadow:0 8px 30px rgba(0,0,0,.7); white-space:pre-line;
  }
  #panel-close {
    margin-top:14px; padding:10px 20px; background:#7a5c3e; color:#fff;
    border:none; border-radius:6px; width:100%; font-size:15px; cursor:pointer;
  }
  #take {
    position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
    color:#fff; background:rgba(8,12,20,.9); padding:7px 14px; border-radius:20px;
    font-size:13px; z-index:20; display:none; pointer-events:none;
  }
  #fade {
    position:fixed; inset:0; background:#000; opacity:0; pointer-events:none;
    z-index:50; transition:opacity .8s;
  }
</style>
</head>
<body>

<div id="rotate">Поверни телефон горизонтально 🔄</div>
<div id="hint">Найди дом с красным окном.</div>
<div id="take">Взять</div>
<div id="panel"></div>
<div id="joy"><div id="knob"></div></div>
<div id="act">Действие</div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= БАЗА =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070d16);
scene.fog = new THREE.FogExp2(0x070d16, 0.022);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 400);

const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

// свет
scene.add(new THREE.HemisphereLight(0x5a7cb0, 0x11151d, 0.5));
const moon = new THREE.DirectionalLight(0xb8c8e8, 0.55);
moon.position.set(-40, 60, 20);
scene.add(moon);

// ================= ПРОЦЕДУРНЫЕ ТЕКСТУРЫ =================
function makeTex(w, h, draw, rx, ry) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (rx) t.repeat.set(rx, ry || rx);
  return t;
}

const texSnow = makeTex(256, 256, (g,w,h) => {
  g.fillStyle = '#dbe3ec'; g.fillRect(0,0,w,h);
  for (let i=0;i<900;i++){
    const v = 205 + Math.random()*50|0;
    g.fillStyle = 'rgba('+v+','+(v+4)+','+(v+10)+','+(.25+Math.random()*.45)+')';
    g.beginPath();
    g.arc(Math.random()*w, Math.random()*h, 1+Math.random()*5, 0, 6.29);
    g.fill();
  }
}, 24, 24);

const texWood = makeTex(256, 256, (g,w,h) => {
  g.fillStyle = '#4b3b2a'; g.fillRect(0,0,w,h);
  for (let i=0;i<10;i++){
    g.fillStyle = i%2 ? '#443525' : '#54432f';
    g.fillRect(0, i*h/10, w, h/10-1);
    g.strokeStyle = 'rgba(18,12,6,.8)';
    g.beginPath(); g.moveTo(0,i*h/10); g.lineTo(w,i*h/10); g.stroke();
  }
  for (let i=0;i<500;i++){
    g.fillStyle = 'rgba(20,13,7,'+(Math.random()*.3)+')';
    g.fillRect(Math.random()*w, Math.random()*h, 2+Math.random()*8, 1+Math.random()*3);
  }
}, 2, 2);

const texStone = makeTex(256, 256, (g,w,h) => {
  g.fillStyle = '#3f4650'; g.fillRect(0,0,w,h);
  for (let i=0;i<45;i++){
    const v = 55 + Math.random()*45|0;
    g.fillStyle = 'rgb('+v+','+(v+3)+','+(v+8)+')';
    g.fillRect(Math.random()*w, Math.random()*h, 16+Math.random()*30, 10+Math.random()*20);
  }
}, 2, 1);

const texRoof = makeTex(256, 256, (g,w,h) => {
  g.fillStyle = '#23262e'; g.fillRect(0,0,w,h);
  for (let i=0;i<16;i++){
    g.fillStyle = i%2 ? '#1e2129' : '#282c35';
    g.fillRect(0, i*h/16, w, h/16-1);
  }
  for (let i=0;i<300;i++){
    g.fillStyle = 'rgba(0,0,0,'+(Math.random()*.35)+')';
    g.fillRect(Math.random()*w, Math.random()*h, 3, 3);
  }
}, 2, 2);

const texRoad = makeTex(256, 128, (g,w,h) => {
  g.fillStyle = '#2c3648'; g.fillRect(0,0,w,h);
  for (let i=0;i<400;i++){
    g.fillStyle = 'rgba(190,205,225,'+(Math.random()*.3)+')';
    g.fillRect(Math.random()*w, Math.random()*h, 2+Math.random()*6, 1+Math.random()*4);
  }
}, 2, 10);

const texWinWarm = makeTex(64, 64, (g,w,h) => {
  g.fillStyle = '#141518'; g.fillRect(0,0,w,h);
  g.fillStyle = '#f0b352';
  g.fillRect(4,4,w/2-7,h/2-7); g.fillRect(w/2+3,4,w/2-7,h/2-7);
  g.fillRect(4,h/2+3,w/2-7,h/2-7); g.fillRect(w/2+3,h/2+3,w/2-7,h/2-7);
  g.strokeStyle = '#0a0b0d'; g.lineWidth = 4; g.strokeRect(0,0,w,h);
});

const matSnow  = new THREE.MeshStandardMaterial({ map:texSnow, roughness:1 });
const matWood  = new THREE.MeshStandardMaterial({ map:texWood, roughness:.85 });
const matStone = new THREE.MeshStandardMaterial({ map:texStone, roughness:.95 });
const matRoof  = new THREE.MeshStandardMaterial({ map:texRoof, roughness:.9 });
const matRoad  = new THREE.MeshStandardMaterial({ map:texRoad, roughness:1 });
const matWin   = new THREE.MeshStandardMaterial({ map:texWinWarm, emissive:0xffa94d, emissiveIntensity:.9, emissiveMap:texWinWarm });
const matWinRed= new THREE.MeshStandardMaterial({ color:0x1a0000, emissive:0xff1e1e, emissiveIntensity:1.6 });

// ================= МИР =================
const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), matSnow);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

function road(x1,z1,x2,z2,w){
  const len = Math.hypot(x2-x1, z2-z1);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, len), matRoad);
  m.rotation.x = -Math.PI/2;
  m.rotation.z = Math.atan2(x2-x1, z2-z1) === 0 ? (z2>z1?-Math.PI/2:Math.PI/2) : Math.atan2(x2-x1, z2-z1);
  m.position.set((x1+x2)/2, 0.02, (z1+z2)/2);
  scene.add(m);
}
road(0, 60, 2, 20, 4.5);
road(2, 20, 0, -5, 4.5);
road(0, -5, -2, -18, 4);
road(-2, -18, -12, -20, 3.5);
road(0, -5, 14, -8, 3.5);
road(-2, -18, -30, -40, 3.5);
road(2, -18, 30, -38, 3.5);
road(0, -18, 0, -42, 3.5);

// коллизии
const colliders = [];
const PR = 0.5;
function collide(px, pz){
  for (const c of colliders){
    const dx = px - c.x, dz = pz - c.z;
    const ox = c.hw + PR - Math.abs(dx);
    const oz = c.hd + PR - Math.abs(dz);
    if (ox > 0 && oz > 0){
      if (ox < oz) px += dx > 0 ? ox : -ox;
      else pz += dz > 0 ? oz : -oz;
    }
  }
  return [px, pz];
}

// интерактивные точки
const spots = []; // {x,z,r,label,key}

// ---- дома ----
function makeHouse(x, z, rot, red){
  const g = new THREE.Group();

  const base = new THREE.Mesh(new THREE.BoxGeometry(6.6, 1.2, 6.6), matStone);
  base.position.y = 0.6; g.add(base);

  const body = new THREE.Mesh(new THREE.BoxGeometry(6, 4.8, 6), matWood);
  body.position.y = 3; g.add(body);

  const wgeo = new THREE.BoxGeometry(1.3, 1.5, .18);
  const w1 = new THREE.Mesh(wgeo, matWin); w1.position.set(-1.8, 2.4, 3.03); g.add(w1);
  const w2 = new THREE.Mesh(wgeo, matWin); w2.position.set(0.4, 2.4, 3.03); g.add(w2);

  if (red){
    const rw = new THREE.Mesh(wgeo, matWinRed); rw.position.set(1.8, 2.4, 3.03); g.add(rw);
    const rl = new THREE.PointLight(0xff2020, 2.4, 11);
    rl.position.set(1.8, 2.4, 4.2); g.add(rl);
  } else {
    const wl = new THREE.PointLight(0xffb050, .9, 8);
    wl.position.set(0, 2.6, 4); g.add(wl);
  }

  const roof = new THREE.Mesh(new THREE.ConeGeometry(5.3, 3.4, 4), matRoof);
  roof.position.y = 6.4; roof.rotation.y = Math.PI/4; g.add(roof);

  const cap = new THREE.Mesh(new THREE.ConeGeometry(5.0, 1.2, 4), matSnow);
  cap.position.y = 7.0; cap.rotation.y = Math.PI/4; g.add(cap);

  const pipe = new THREE.Mesh(new THREE.BoxGeometry(.8, 2.2, .8), matStone);
  pipe.position.set(1.7, 6.6, 0); g.add(pipe);

  const porch = new THREE.Mesh(new THREE.BoxGeometry(2.4, .35, 1.4), matWood);
  porch.position.set(0, .18, 3.6); g.add(porch);

  g.position.set(x, 0, z); g.rotation.y = rot || 0;
  scene.add(g);
  colliders.push({ x:x, z:z, hw:3.5, hd:3.5 });
}

const houseSpots = [[-20,-10,false],[20,-10,false],[-30,-30,false],[30,-30,false],[-15,-45,false],[15,-45,false],[0,-55,false]];
houseSpots.forEach(p => makeHouse(p[0], p[1], 0, p[2]));
makeHouse(-20, -10, 0, true); // дом с красным окном

// ---- почта ----
(function(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(8, 6, 7), matWood);
  body.position.y = 3; g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(6.4, 3.6, 4), matRoof);

// ---- колодец ----
(function(){
  const g = new THREE.Group();
  const logGeo = new THREE.BoxGeometry(.38, 1.5, 1.0);
  for (let i=0;i<10;i++){
    const a = i*Math.PI*2/10;

// ---- мельница ----
let millBlades;
(function(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 4, 10, 8), matWood);
  body.position.y = 5; g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(4.4, 3, 8), matRoof);
  roof.position.y = 11.5; g.add(roof);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(4.0, 1, 8), matSnow);
  cap.position.y = 12.6; g.add(cap);

  millBlades = new THREE.Group();
  for (let i=0;i<4;i++){
    const arm = new THREE.Mesh(new THREE.BoxGeometry(.4, 8, .15), matWood);
    arm.position.y = 4; arm.rotation.z = i*Math.PI/2;
    const sail = new THREE.Mesh(new THREE.BoxGeometry(1.1, 6.5, .06),
      new THREE.MeshStandardMaterial({ color:0x8a8378, roughness:1 }));
    sail.position.set(1.2, 4.2, 0);
    sail.rotation.z = i*Math.PI/2;
    const armGroup = new THREE.Group();
    armGroup.add(arm); armGroup.add(sail);
    armGroup.rotation.z = i*Math.PI/2;
    arm.position.set(0,0,0);
    armGroup.children[0].position.set(0,4,0);
    millBlades.add(armGroup);
  }
  millBlades.position.set(0, 8, 4.2);
  g.add(millBlades);

  const wglow = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.6, .2), matWin);
  wglow.position.set(0, 6.5, 3.5); g.add(wglow);

  g.position.set(-30, 0, -44);
  scene.add(g);
  colliders.push({ x:-30, z:-44, hw:4.4, hd:4.4 });
  spots.push({ x:-30, z:-38, r:4.5, key:'mill' });
})();

// ---- деревья ----
const matPine = new THREE.MeshStandardMaterial({ color:0x1c3324, roughness:1 });
function tree(x, z){

  t.position.y = 1.1; g.add(t);

  const s1 = new THREE.Mesh(new THREE.ConeGeometry(1.35,.55,8), matSnow); s1.position.y = 4.1; g.add(s1);

[[-8,30],[9,26],[-9,14],[10,4],[-10,-8],[9,-24],[-9,-32],[13,-20],[-16,-8],[18,-14],
 [-24,-16],[26,-22],[-36,-28],[34,-30],[-22,-40],[22,-46],[-6,-52],[8,-54],

[[2,18],[0,-2],[-2,-16],[-11,-19],[13,-7],[1,-40],[-29,-38],[29,-36],[-19,-7],[21,-7]].forEach(p => lamp(p[0], p[1]));

// ---- сугробы ----
function drift(x, z, s){
  const d = new THREE.Mesh(new THREE.SphereGeometry(s, 7, 5), matSnow);
  d.scale.y = .42; d.position.set(x, .08, z);
  scene.add(d);
}
[[-4,50],[5,42],[-6,30],[6,10],[-5,-2],[7,-12],[-6,-24],[9,-16],[-8,-34],[12,-30],[-16,-28],[20,-34],[26,-2],[-26,6]]
  .forEach(p => drift(p[0], p[1], 1+Math.random()*1.4));

// ---- заборы ----
function fence(x1,z1,x2,z2){
  const g = new THREE.Group();
  const len = Math.hypot(x2-x1, z2-z1);
  const n = Math.max(2, Math.floor(len/2));
  for (let i=0;i<=n;i++){
    const t = i/n;
    const post = new THREE.Mesh(new THREE.BoxGeometry(.12,1.1,.12), matWood);
    post.position.set(x1+(x2-x1)*t, .55, z1+(z2-z1)*t);
    g.add(post);
  }
  for (let ry=0; ry<2; ry++){
    const rail = new THREE.Mesh(new THREE.BoxGeometry(len,.08,.08), matWood);
    rail.position.set((x1+x2)/2, .9 - ry*.4, (z1+z2)/2);
    rail.rotation.y = -Math.atan2(z2-z1, x2-x1);
    g.add(rail);
  }
  scene.add(g);
}
fence(-4.5, 18, -4.5, -2);
fence(6.5, 18, 6.5, 2);
fence(-4.5, -24, -4.5, -38);

// ---- снегопад ----

for (let i=0;i<SNOW_N;i++){
  snowArr[i*3]   = (Math.random()-.5)*240;
  snowArr[i*3+1] = Math.random()*60;

}
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowArr, 3));
const snowPts = new THREE.Points(snowGeo,
  new THREE.PointsMaterial({ color:0xffffff, size:.13, transparent:true, opacity:.85 }));
scene.add(snowPts);

// ================= УПРАВЛЕНИЕ =================
const joy = document.getElementById('joy');
const knob = document.getElementById('knob');
const move = { x:0, y:0 };
let joyId = null, joyCX = 0, joyCY = 0;

function joyHandle(t){
  let dx = t.clientX - joyCX, dy = t.clientY - joyCY;
  const max = 50, len = Math.hypot(dx, dy);
  if (len > max){ dx = dx/len*max; dy = dy/len*max; }
  knob.style.left = (45+dx)+'px';
  knob.style.top  = (45+dy)+'px';
  move.x = dx/max; move.y = dy/max;
}
joy.addEventListener('touchstart', function(e){
  const t = e.changedTouches[0];
  joyId = t.identifier;
  const r = joy.getBoundingClientRect();
  joyCX = r.left + r.width/2;
  joyCY = r.top + r.height/2;
  joyHandle(t);
  e.preventDefault();
}, {passive:false});

let lookId = null, lastX = 0, lastY = 0, yaw = 0, pitch = 0;

document.addEventListener('touchstart', function(e){
  for (const t of e.changedTouches){
    if (t.identifier === joyId) continue;
    const onUI = t.target === joy || joy.contains(t.target) ||
                 t.target === actBtn || actBtn.contains(t.target) ||
                 t.target === panel || panel.contains(t.target);
    if (onUI) continue;
    if (lookId === null){ lookId = t.identifier; lastX = t.clientX; lastY = t.clientY; }
  }
});
document.addEventListener('touchmove', function(e){
  for (const t of e.changedTouches){
    if (t.identifier === joyId) joyHandle(t);
    else if (t.identifier === lookId){
      yaw   -= (t.clientX - lastX) * .005;
      pitch -= (t.clientY - lastY) * .005;
      if (pitch >  1.2) pitch =  1.2;
      if (pitch < -1.2) pitch = -1.2;
      lastX = t.clientX; lastY = t.clientY;
    }
  }
  e.preventDefault();
}, {passive:false});
function touchEnd(e){
  for (const t of e.changedTouches){
    if (t.identifier === joyId){
      joyId = null; move.x = 0; move.y = 0;
      knob.style.left = '45px'; knob.style.top = '45px';
    }
    if (t.identifier === lookId) lookId = null;
  }
}
document.addEventListener('touchend', touchEnd);
document.addEventListener('touchcancel', touchEnd);

// мышь для проверки на ПК
document.addEventListener('mousemove', function(e){
  if (document.pointerLockElement === renderer.domElement){
    yaw   -= e.movementX * .0025;
    pitch -= e.movementY * .0025;
    if (pitch >  1.2) pitch =  1.2;
    if (pitch < -1.2) pitch = -1.2;
  }
});
renderer.domElement.addEventListener('click', function(){
  if (!('ontouchstart' in window)) renderer.domElement.requestPointerLock();
});
document.addEventListener('keydown', function(e){
  if (e.code === 'KeyW') keys.w = true;
  if (e.code === 'KeyA') keys.a = true;
  if (e.code === 'KeyS') keys.s = true;
  if (e.code === 'KeyD') keys.d = true;
  if (e.code === 'KeyE') doAction();
});
document.addEventListener('keyup', function(e){
  if (e.code === 'KeyW') keys.w = false;
  if (e.code === 'KeyA') keys.a = false;
  if (e.code === 'KeyS') keys.s = false;
  if (e.code === 'KeyD') keys.d = false;
});
const keys = { w:false, a:false, s:false, d:false };

// ================= СЮЖЕТ =================
const hintEl = document.getElementById('hint');
const takeEl = document.getElementById('take');
const panel  = document.getElementById('panel');
const fade   = document.getElementById('fade');
const actBtn = document.getElementById('act');

let stage = 0; // 0 письмо, 1 колодец, 2 почта, 3 мельница, 4 финал
let nearSpot = null;

document.getElementById('panel-close') && panel.addEventListener('click', function(e){
  if (e.target.id === 'panel-close') panel.style.display = 'none';
});

const TEXTS = {
  letter:
    'Метельск, 14 декабря 1987 г.\n\n'+
    'Кто бы это ни читал — не стойте на открытом месте после заката.\n'+
    'Мельница крутится, хотя ветер стих три дня назад.\n\n'+
    'Под валуном у колодца спрятан ключ от почты. Возьмите его и идите туда.\n\n'+
    '— А. Северцев',
  well:
    'Ты отодвигаешь валун. Под ним — ржавый ключ и записка:\n\n'+
    '«Ключ откроет почту. Там хранится журнал смотрителя.\n'+
    'Последняя запись сделана в ночь, когда village замело. Ищи почту». \n\n'+
    'Ключ у тебя.',
  post:
    'Замок поддаётся. Внутри — журнал смотрителя, последняя страница:\n\n'+
    '«3 декабря. Мельница повернулась к деревне жерновом.\n'+
    'Никто не смел подходить к ней с тех пор, как пропал старый мельник.\n\n'+
    'Если мельница снова заработает — всё закончится. Нужно подойти к её дверям». \n\n'+
    'Журнал у тебя. Пора к мельнице.',
  mill:
    'Дверь мельницы приоткрыта. Внутри, в круге лунного света, —\n'+
    'застывшая фигура у жерновов. Она медленно поворачивает голову…\n\n'+
    'Экран гаснет. Метель усиливается.\n\n'+
    'КОНЕЦ ПЕРВОЙ ГЛАВЫ.\nПродолжение следует…'
};

function showPanel(text){
  panel.innerHTML = text + '<br><br><button id="panel-close">Закрыть</button>';
  panel.style.display = 'block';
}

function doAction(){
  if (panel.style.display === 'block'){ panel.style.display = 'none'; return; }
  if (!nearSpot) return;
  const key = nearSpot.key;
  if (key === 'letter' && stage === 0){
    letter.visible = false;
    showPanel(TEXTS.letter);
    hintEl.textContent = 'Ищи колодец во дворе (справа от дороги).';
    stage = 1;
  } else if (key === 'well' && stage === 1){
    showPanel(TEXTS.well);
    hintEl.textContent = 'Отправляйся к почте (слева у дороги).';
    stage = 2;
  } else if (key === 'post' && stage === 2){
    showPanel(TEXTS.post);
    hintEl.textContent = 'Иди вглубь деревни — к старой мельнице.';
    stage = 3;
  } else if (key === 'mill' && stage === 3){
    stage = 4;
    fade.style.opacity = 1;
    hintEl.textContent = '';
    actBtn.style.display = 'none';
    joy.style.display = 'none';
    setTimeout(function(){
      showPanel(TEXTS.mill);
    }, 900);
  }
}
actBtn.addEventListener('click', doAction);

// ================= ЦИКЛ =================
camera.position.set(0, 1.7, 50);
camera.rotation.order = 'YXZ';

const SPEED = 0.13;

function orientCheck(){
  const rot = document.getElementById('rotate');
  if (innerHeight > innerWidth) rot.style.display = 'flex';
  else rot.style.display = 'none';
}
orientCheck();
addEventListener('resize', function(){
  orientCheck();
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let t = 0;
function animate(){
  requestAnimationFrame(animate);
  t += 0.016;

  // движение (WASD + джойстик)
  let mx = move.x, my = -move.y;
  if (keys.w) my += 1;
  if (keys.s) my -= 1;
  if (keys.a) mx -= 1;
  if (keys.d) mx += 1;

  if (mx || my){
    const len = Math.hypot(mx, my);
    if (len > 1){ mx /= len; my /= len; }
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const rx =  Math.cos(yaw), rz = -Math.sin(yaw);
    let nx = camera.position.x + (fx*my + rx*mx) * SPEED;
    let nz = camera.position.z + (fz*my + rz*mx) * SPEED;
    const res = collide(nx, nz);
    camera.position.x = res[0];
    camera.position.z = res[1];
  }

  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  // мельница вращается
  millBlades.rotation.z += 0.15;

  // снег
  const pos = snowGeo.attributes.position;
  for (let i=0;i<SNOW_N;i++){
    let y = pos.getY(i) - 0.09;
    if (y < 0) y = 60;
    pos.setY(i, y);
  }
  pos.needsUpdate = true;

  // ближайшая интерактивная точка
  nearSpot = null;
  let best = 1e9;
  if (stage === 0){
    const d = Math.hypot(camera.position.x - letter.position.x, camera.position.z - letter.position.z);
    if (d < 3){ nearSpot = { key:'letter' }; best = d; }
  } else {
    for (const s of spots){
      const d = Math.hypot(camera.position.x - s.x, camera.position.z - s.z);
      if (d < s.r && d < best){ best = d; nearSpot = s; }
    }
  }
  if (nearSpot && stage < 4) takeEl.style.display = 'block';
  else takeEl.style.display = 'none';

  renderer.render(scene, camera);
}
animate();
</script>
