<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Зимняя деревня: Метельск</title>
    <style>
        body { margin: 0; overflow: hidden; background: #2b3a4d; touch-action: none;
               font-family: Arial, sans-serif; }
        /* Подсказка квеста сверху */
        #quest-hint {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            color: #dfe8f2; background: rgba(20,30,45,0.75);
            padding: 8px 14px; border-radius: 8px; font-size: 14px;
            z-index: 20; pointer-events: none; max-width: 90%; text-align: center;
        }
        /* Панель с текстом (письмо/дневник) */
        #panel {
            position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
            background: #f4ecd8; color: #2b2114; padding: 18px;
            border-radius: 10px; max-width: 300px; max-height: 70vh; overflow-y: auto;
            font-size: 14px; line-height: 1.5; display: none; z-index: 30;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5); white-space: pre-line;
        }
        #panel-close {
            margin-top: 12px; padding: 8px 18px; background: #7a5c3e; color: #fff;
            border: none; border-radius: 6px; width: 100%; font-size: 14px;
        }
        /* Джойстик слева */
        #joy {
            position: fixed; bottom: 30px; left: 25px; width: 130px; height: 130px;
            border-radius: 65px; background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25); z-index: 20;
        }
        #knob {
            position: absolute; left: 40px; top: 40px; width: 50px; height: 50px;
            border-radius: 25px; background: rgba(255,255,255,0.35);
            border: 2px solid #fff;
        }
    </style>
</head>
<body>
    <div id="quest-hint">Пройди к центру деревни. Найди письмо на пороге дома.</div>
    <div id="panel"></div>
    <div id="joy"><div id="knob"></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    // ===== СЦЕНА. Глава 1: серо-синяя гамма, туман =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b3a4d);
    scene.fog = new THREE.Fog(0x2b3a4d, 15, 60);

    const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x8a99b0, 0.8));
    const moon = new THREE.DirectionalLight(0xcdd6ff, 0.7);
    moon.position.set(-10, 20, 5);
    scene.add(moon);

    // Снежный пол
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0xdde6ee })
    );
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);

    // ===== Деревня Метельск: 9 домов, лавка, колодец, почта, ствол ёлки =====
    function makeHouse(x, z, color) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(6, 5, 6),
        new THREE.MeshStandardMaterial({ color: color })
      );
      body.position.y = 2.5;
      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(5, 3, 4),
        new THREE.MeshStandardMaterial({ color: 0x2c2c34 })
      );
      roof.position.y = 6.5; roof.rotation.y = Math.PI/4;
      const win = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 1.2, 0.2),
        new THREE.MeshStandardMaterial({ color: 0xffd86b, emissive: 0xffb300 })
      );
      win.position.set(0, 2.5, 3.05);
      g.add(body, roof, win);
      g.position.set(x, 0, z);
      scene.add(g);
      return g;
    }
    // 9 домов
    const houseColors = [0x4d5a63, 0x5d5348, 0x465a4f, 0x5a4d5a, 0x4d4a5a, 0x5a5d4d, 0x50463d, 0x3d4d55, 0x554d5d];
    const houseSpots = [[-20,-10],[20,-10],[-30,-30],[30,-30],[-15,-45],[15,-45],[0,-55],[-35,-15],[35,-15]];
    houseSpots.forEach((p, i) => makeHouse(p[0], p[1], houseColors[i]));

    // Почта (больше и светлее, чем дома)
    const post = makeHouse(-15, -5, 0x6b7a85);
    post.scale.set(1.2, 1, 1);

    // Лавка
    makeHouse(15, -5, 0x7a6650);

    // Колодец
    const well = new THREE.Mesh(
      new THREE.CylinderGeometry(1.5, 1.5, 2, 12),
      new THREE.MeshStandardMaterial({ color: 0x4a4038 })
    );
    well.position.set(0, 1, -20);
    scene.add(well);

    // Площадь: голый ствол ёлки без звезды (по лору)
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.8, 12, 8),
      new THREE.MeshStandardMaterial({ color: 0x3a3230 })
    );
    trunk.position.set(0, 6, -35);
    scene.add(trunk);

    // Мельница на западе
    const mill = new THREE.Mesh(
      new THREE.CylinderGeometry(3, 4, 14, 8),
      new THREE.MeshStandardMaterial({ color: 0x4a3b2e })
    );
    mill.position.set(-40, 7, -60);
    scene.add(mill);

    // ===== КВЕСТ ДНЯ 21: письмо на пороге =====
    // Дом игрока — ближайший. Письмо лежит у его входа.
    const letter = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 0.1, 0.8),
      new THREE.MeshStandardMaterial({ color: 0xf5f0e0, emissive: 0x554422 })
    );
    letter.position.set(3.5, 0.3, -7); // порог дома [20,-10]
    scene.add(letter);

    // Дневник почтальона — появится у почты ПОСЛЕ прочтения письма
    const diary = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 0.2, 0.6),
      new THREE.MeshStandardMaterial({ color: 0x3a2a1a })
    );
    diary.position.set(-13, 0.3, -2.5);
    diary.visible = false;
    scene.add(diary);

    // Указатель над дневником (после письма)
    const marker = new THREE.Mesh(
      new THREE.ConeGeometry(0.4, 1, 8),
      new THREE.MeshBasicMaterial({ color: 0xffd54f })
    );
    marker.position.set(-13, 3, -2.5);
    marker.rotation.x = Math.PI;
    marker.visible = false;
    scene.add(marker);

    // Снег (частицы, шейдер сделаем позже — по плану оптимизации)
    const snowflakes = [];
    for (let i = 0; i < 250; i++) {
      const f = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 4, 4),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      f.position.set((Math.random()-0.5)*120, Math.random()*40, (Math.random()-0.5)*120);
      snowflakes.push(f);
      scene.add(f);
    }

    // ===== УПРАВЛЕНИЕ: джойстик слева, свайп справа — камера =====
    let yaw = 0, pitch = -0.1;
    const player = new THREE.Vector3(0, 1.6, 15);
    let joyVec = { x: 0, y: 0 };
    let lookTouch = null;
    let joyTouch = null;
    const joyCenter = { x: 0, y: 0 };
    const knob = document.getElementById('knob');

    const joyEl = document.getElementById('joy');
    joyEl.addEventListener('touchstart', e => {
      e.preventDefault();
      joyTouch = e.changedTouches[0].identifier;
      const r = joyEl.getBoundingClientRect();
      joyCenter.x = r.left + 65; joyCenter.y = r.top + 65;
    }, { passive: false });

    document.addEventListener('touchmove', e => {
      for (const t of e.changedTouches) {
        if (t.identifier === joyTouch) {
          let dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
          const len = Math.hypot(dx, dy);
          if (len > 50) { dx = dx/len*50; dy = dy/len*50; }
          knob.style.transform = `translate(${dx}px, ${dy}px)`;
          joyVec.x = dx/50; joyVec.y = dy/50;
        } else if (lookTouch && t.identifier === lookTouch.id) {
          yaw -= (t.clientX - lookTouch.x) * 0.005;
          pitch = Math.max(-1, Math.min(0.8, pitch - (t.clientY - lookTouch.y) * 0.005));
          lookTouch.x = t.clientX; lookTouch.y = t.clientY;
        }
      }
    }, { passive: false });

    document.addEventListener('touchend', e => {
      for (const t of e.changedTouches) {
        if (t.identifier === joyTouch) {
          joyTouch = null; joyVec = { x: 0, y: 0 };
          knob.style.transform = 'translate(0, 0)';
        }
        if (lookTouch && t.identifier === lookTouch.id) {
          // короткий тап без движения = взаимодействие
          if (Math.abs(t.clientX - lookTouch.startX) < 15 &&
              Math.abs(t.clientY - lookTouch.startY) < 15 &&
              Date.now() - lookTouch.t0 < 400) {
            tryInteract(t.clientX, t.clientY);
          }
          lookTouch = null;
        }
      }
    });

    // Свайп-камера: любое касание НЕ по джойстику и НЕ по панели
    document.body.addEventListener('touchstart', e => {
      for (const t of e.changedTouches) {
        if (t.identifier === joyTouch) continue;
        if (lookTouch === null) {
          lookTouch = { id: t.identifier, x: t.clientX, y: t.clientY, startX: t.clientX, startY: t.clientY, t0: Date.now() };
        }
      }
    }, { passive: false });

    // ===== ВЗАИМОДЕЙСТВИЕ (тап по объекту) =====
    let questStep = 0; // 0 = найти письмо, 1 = найти дневник, 2 = квест пройден
    const hint = document.getElementById('quest-hint');
    const panel = document.getElementById('panel');
    const LETTER_TEXT =
`Здравствуй, гость.

Если ты читаешь это — значит, ты ещё слышишь своё дыхание. Уже хорошо.

В Метельске каждую зиму что-то исчезает. В этом году первым ушли звуки. Колокола молчат, собаки не лают, и даже ветер здесь ходит на цыпочках.

Говорят, если собрать все шесть Осколков праздника и зажечь ими звезду на ёлке — Тишина отступит.

Начни с почты. Там тебя ждёт дневник почтальона. Только не читай последнюю запись вслух.

— Т.`;

    const DIARY_TEXT =
`Дневник почтальона. Записи за декабрь.

1. Ярмарка была шумной. Впервые за много лет.
2. Вчера пропало эхо. Искал его у мельницы — не нашёл.
3. Пётр не выходит из-за жернова. Мельница крутится сама.
4. Гоша открыл лавку. Товаров нет, но лавка «полная».
5. Дети перестали смеяться. Просто перестали.
6. Соседи жалуются: перестают слышать собственные шаги.
7. Ночью смотрел в окно — во дворе стоял туман в форме человека.
8. Туман подходит всё ближе. Если он дойдёт до моей двери, я не успе

(запись обрывается на середине слова)`;

    panel.innerHTML = '<div id="panel-content"></div><button id="panel-close" onclick="closePanel()">Закрыть</button>';

    window.closePanel = function() {
      panel.style.display = 'none';
      if (panel.dataset.on === 'letter') {
        panel.dataset.on = '';
        questStep = 1;
        diary.visible = true;
        marker.visible = true;
        hint.textContent = 'Иди к почте — там лежит дневник почтальона.';
      } else if (panel.dataset.on === 'diary') {
        panel.dataset.on = '';
        questStep = 2;
        marker.visible = false;
        hint.textContent = 'Квест дня 21 «Письмо» пройден! +1 монетка праздника';
      }
    };

    const raycaster = new THREE.Raycaster();
    function tryInteract(x, y) {
      if (panel.style.display === 'block') return;
      const ndc = new THREE.Vector2((x/innerWidth)*2-1, -(y/innerHeight)*2+1);
      raycaster.setFromCamera(ndc, camera);
      const targets = [];
      if (questStep === 0) targets.push(letter);
      if (questStep === 1) targets.push(diary);
      const hits = raycaster.intersectObjects(targets);
      if (!hits.length) return;
      const dist = hits[0].object.position.distanceTo(player);
      if (dist > 5) { hint.textContent = 'Подойди ближе.'; return; }
      if (hits[0].object === letter) {
        panel.querySelector('#panel-content').textContent = LETTER_TEXT;
        panel.dataset.on = 'letter';
        panel.style.display = 'block';
      } else if (hits[0].object === diary) {
        panel.querySelector('#panel-content').textContent = DIARY_TEXT;
        panel.dataset.on = 'diary';
        panel.style.display = 'block';
      }
    }

    // ===== ЦИКЛ =====
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      // Движение игрока
      const speed = 5;
      const fwd = new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(0, yaw, 0));
      const right = new THREE.Vector3(1,0,0).applyEuler(new THREE.Euler(0, yaw, 0));
      player.addScaledVector(fwd, -joyVec.y * speed * dt);
      player.addScaledVector(right, joyVec.x * speed * dt);

      // Границы деревни
      player.x = Math.max(-60, Math.min(60, player.x));
      player.z = Math.max(-70, Math.min(60, player.z));

      camera.position.set(player.x, 1.6, player.z);
      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      // Снег падает
      snowflakes.forEach(f => {
        f.position.y -= 0.1;
        if (f.position.y < 0) f.position.y = 40;
      });

      // Письмо чуть светится, чтобы его заметить
      letter.rotation.y += 0.02;
      letter.material.emissive.setScalar(0.2 + 0.15*Math.sin(Date.now()*0.004));

      // Указатель качается
      if (marker.visible) marker.position.y = 3 + Math.sin(Date.now()*0.005)*0.3;

      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    </script>
</body>
</html>
